<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Contraseña</title>
  <link rel="stylesheet" href="recuperar.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <form id="formulariorecuperar" class="container mt-5 needs-validation" novalidate>
    <h2 class="text-center mb-4">Recuperar contraseña</h2>

    <!-- Rol -->
    <div class="mb-3">
      <select class="form-select text-center" id="rol" required>
        <option value="" disabled selected>Selecciona tu rol</option>
        <option value="1">Administrador</option>
        <option value="2">Docente</option>
        <option value="3">Estudiante</option>
        <option value="4">Padre</option>
      </select>
      <div class="invalid-feedback">Por favor, selecciona un rol.</div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <input type="email" class="form-control text-center" id="emailLogin" placeholder="Correo electrónico" required />
      <div class="invalid-feedback">Por favor, ingresa un correo válido.</div>
    </div>

    <!-- Contraseña -->
    <div class="mb-3">
      <div class="input-group">
        <input type="password" class="form-control text-center" id="exampleInputPasswordReg" placeholder="Contraseña" required />
        <button class="btn btn-outline-secondary" type="button" id="togglePasswordReg">
          <i class="bi bi-eye-slash" id="eye-icon-reg"></i>
        </button>
      </div>
      <div class="form-text mt-2">
        La contraseña debe contener:
        <ul class="mb-0 list-unstyled">
          <li><i class="bi bi-x-circle text-danger me-1" id="req-length"></i> Al menos 8 caracteres</li>
          <li><i class="bi bi-x-circle text-danger me-1" id="req-uppercase"></i> Al menos una letra mayúscula</li>
          <li><i class="bi bi-x-circle text-danger me-1" id="req-number"></i> Al menos un número</li>
        </ul>
      </div>
    </div>

    <!-- Confirmar Contraseña -->
    <div class="mb-3">
      <div class="input-group">
        <input type="password" class="form-control text-center" id="exampleInputConfirmPasswordReg" placeholder="Confirmar contraseña" required />
        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPasswordReg">
          <i class="bi bi-eye-slash" id="eye-icon-confirm-reg"></i>
        </button>
      </div>
      <div id="confirmPasswordError" class="text-danger mt-1" style="display: none;">Las contraseñas no coinciden</div>
    </div>

    <!-- Botón de envío -->
    <div class="text-center">
      <button type="button" class="btn btn-primary w-100" id="submitBtn" disabled>Recuperar</button>
    </div>

    <!-- Enlace para volver -->
    <div class="text-center mt-3">
      <a href="../index.html" class="text-decoration-none">Volver al inicio de sesión</a>
    </div>
  </form>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="recuperar.js"></script>
</body>
</html>
