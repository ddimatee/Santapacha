<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Contraseña</title>
  <link rel="stylesheet" href="recuperar.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <form id="formulariorecuperar" class="container mt-5 needs-validation" novalidate>
    <h2 class="text-center mb-4">Recuperar contraseña</h2>
    <h6 class="text-center mb-4">Te enviaremos un enlace al correo electrónico ingresado.</h6>

    <!-- Rol -->
    <div class="mb-3">
      <select class="form-select text-center" id="rol" required>
        <option value="" disabled selected>Selecciona tu rol</option>
        <option value="1">Administrador</option>
        <option value="2">Docente</option>
        <option value="3">Estudiante</option>
        <option value="4">Padre</option>
      </select>
      <div class="invalid-feedback">Por favor, selecciona un rol.</div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <input type="email" class="form-control text-center" id="emailLogin" placeholder="Correo electrónico" required />
      <div class="invalid-feedback">Por favor, ingresa un correo válido.</div>
    </div>

    <!-- Botón de envío -->
    <div class="text-center"><button type="button" class="btn btn-primary w-100" id="submitBtn">Enviar</button>
    </div>

    <!-- Enlace para volver -->
    <div class="text-center mt-3">
      <a href="../index.html" class="text-decoration-none">Volver al inicio de sesión</a>
    </div>
  </form>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="recuperar.js"></script>
</body>
</html>
