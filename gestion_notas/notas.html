<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Notas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="notas.css">
</head>
<body>
    <!-- Encabezado -->
    <div class="header">
        <span>Administrador</span>
    </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <span>Inicio → Gestión de Notas</span>
    </div>

    <!-- Contenedor principal -->
    <div class="content-wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>GESTIÓN DE NOTAS</h2>
            <div class="menu-options">
                <a href="#crearNota" class="menu-item">Crear Nota</a>
                <a href="#modificarNota" class="menu-item">Modificar Nota</a>
                <a href="#borrarNota" class="menu-item">Borrar Nota</a>
                <a href="#verNotas" class="menu-item">Ver Notas</a>
                <a href="#asignarNota" class="menu-item">Asignar Notas</a>
                <a href="/Santapacha/pantalla_docente/menu/indexv2.html" class="menu-item">Volver al Menú</a>
            </div>
        </div>

        <!-- Área de contenido -->
        <div class="content">
<!-- Crear Nota -->
<div id="crearNota" class="section-content">
    <h3>Crear Nota</h3>
    <form>
        <div class="mb-3">
            <label class="form-label">Asignatura</label>
            <select class="form-select" required>
                <option value="">Seleccione una asignatura</option>
                <option value="1">Matemáticas</option>
                <option value="2">Física</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Periodo</label>
            <select class="form-select" required>
                <option value="">Seleccione un periodo</option>
                <option value="1">Primer Periodo</option>
                <option value="2">Segundo Periodo</option>
                <option value="3">Tercer Periodo</option>
                <option value="4">Cuarto Periodo</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Tipo de Evaluación</label>
            <select class="form-select" required>
                <option value="">Seleccione el tipo de evaluación</option>
                <option value="1">Examen</option>
                <option value="2">Tarea</option>
                <option value="3">Proyecto</option>
                <option value="4">Participación</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Nota</label>
            <input type="number" class="form-control" min="0" max="20" step="0.01" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Nota</button>
    </form>
</div>

            <!-- Modificar Nota -->
            <div id="modificarNota" class="section-content">
                <h3>Modificar Nota</h3>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Seleccione la Nota a Modificar</label>
                        <select class="form-select" required>
                            <option value="">Seleccione una nota</option>
                            <option value="1">Juan Pérez - Matemáticas - Nota: 8</option>
                            <option value="2">María García - Física - Nota: 10</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nueva Nota</label>
                        <input type="number" class="form-control" min="0" max="20" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Modificar Nota</button>
                </form>
            </div>

            <!-- Borrar Nota -->
            <div id="borrarNota" class="section-content">
                <h3>Borrar Nota</h3>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Seleccione la Nota a Borrar</label>
                        <select class="form-select" required>
                            <option value="">Seleccione una nota</option>
                            <option value="1">Juan Pérez - Matemáticas - Nota: 8</option>
                            <option value="2">María García - Física - Nota: 10</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-danger">Borrar Nota</button>
                </form>
            </div>

            <!-- Ver Notas -->
            <div id="verNotas" class="section-content">
                <h3>Ver Notas</h3>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-primary">
                            <tr>
                                <th>Estudiante</th>
                                <th>Asignatura</th>
                                <th>Nota</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Juan Pérez</td>
                                <td>Matemáticas</td>
                                <td>8</td>
                            </tr>
                            <tr>
                                <td>María García</td>
                                <td>Física</td>
                                <td>10</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Asignar Notas -->
            <div id="asignarNota" class="section-content">
                <h3>Asignar Notas</h3>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Estudiante</label>
                        <select class="form-select" required>
                            <option value="">Seleccione un estudiante</option>
                            <option value="1">Juan Pérez</option>
                            <option value="2">María García</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Asignatura</label>
                        <select class="form-select" required>
                            <option value="">Seleccione una asignatura</option>
                            <option value="1">Matemáticas</option>
                            <option value="2">Física</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nota</label>
                        <input type="number" class="form-control" min="0" max="20" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Asignar Nota</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
