<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa-pacha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Encabezado con logo y mensaje de bienvenida -->
    <div class="welcome-container">
        <div class="santa-pacha">
            <img src="./img/escudo-menu.png" alt="Santa Pacha Logo" style="width: 200px; height: auto;">
        </div>
        <div class="welcome-message">¡BIENVENIDO, PADRE!</div>
    </div>

    <!-- Contenedor principal de la página -->
    <div class="container">
        <div class="row g-3">
            <!-- reportes academicos -->
            <div class="col-md-4">
                <a href="reportes/reportes.html" class="text-decoration-none">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">
                          <img src="https://img.icons8.com/ios/100/000000/document.png" alt="Ver Reportes Académicos" class="mb-2 mx-auto d-block" style="width: 90px; height: 90px;">                            <h5 class="card-title mt-2">Ver reportes</h5>
                        </div>
                    </div>
                </a>
            </div>

            <!-- notas-->
            <div class="col-md-4">
                <a href="notas/notas.html" class="text-decoration-none">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">
                          <img src="https://img.icons8.com/color/96/000000/error--v1.png" alt="Ver Notas" class="mb-2 mx-auto d-block" style="width: 90px; height: 90px;">                            <h5 class="card-title mt-2">Ver notas</h5>
                        </div>
                    </div>
                </a>
            </div>

            <!-- notificaciones -->
            <div class="col-md-4">
                <a href="notificaciones/notificaciones.html" class="text-decoration-none">
                    <div class="card shadow-sm">
                        <div class="card-body text-center">
                          <img src="https://img.icons8.com/ios-filled/100/000000/bell.png" alt="Notificaciones" class="mb-2 mx-auto d-block" style="width: 90px; height: 90px;">                            <h5 class="card-title mt-2">Notificaciones</h5>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
