<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Padre de Familia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="reportes.css">
</head>
<body>

<header class="d-flex justify-content-between align-items-center p-3" style="background-color: #d6f3ff;">
  <div class="d-flex align-items-center">
    <img src="img/escudo-menu.png" alt="Escudo" class="me-3 mx-auto d-block" style="width: 60px; height: auto;">
    <div class="fs-5 fw-bold">
      COLEGIO <br>
      SANTA PACHA
    </div>
  </div>
  <h1 class="fs-3 m-0 text-primary">¡BIENVENIDO, PADRE DE FAMILIA!</h1>
</header>

<main class="container my-5">
  <h2 class="mb-4 text-center text-primary">Desempeño Académico</h2>
  <div class="table-responsive">
    <table class="table table-bordered table-striped text-center">
      <thead class="table-info">
        <tr>
          <th>Materia</th>
          <th>Calificación</th>
          <th>Comentarios</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Matemáticas</td>
          <td><strong>9.5</strong></td>
          <td class="text-success">Excelente desempeño</td>
        </tr>
        <tr>
          <td>Ciencias</td>
          <td><strong>8.2</strong></td>
          <td class="text-warning">Requiere mejorar</td>
        </tr>
        <tr>
          <td>Lengua</td>
          <td><strong>9.0</strong></td>
          <td class="text-info">Buena participación</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<footer class="text-center mt-5" style="background-color: #d6f3ff; padding: 15px;">
  <p class="mb-0 text-dark">&copy; 2025 Colegio Santa Pacha - Todos los derechos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
