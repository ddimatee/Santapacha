<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Notificaciones - Padre de Familia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="notificaciones.css">
</head>
<body style="background-color: #d6f3ff;">

<header class="d-flex justify-content-center align-items-center p-4" style="background-color: #d6f3ff;">
  <h1 class="fs-2 text-primary text-center">NOTIFICACIONES</h1>
</header>

<main class="container my-4">
  <ul class="list-group shadow">
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Reunión de Padres
      <span class="badge bg-primary rounded-pill">15 mayo, 18:00</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Cierre de inscripciones
      <span class="badge bg-danger rounded-pill">30 abril</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Examen de matemáticas
      <span class="badge bg-warning text-dark rounded-pill">5 junio, 10:00</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Entrega de informes
      <span class="badge bg-success rounded-pill">20 mayo</span>
      
    </li>
  </ul>
</main>
<!-- Botón de Volver -->
<div class="text-center mt-4">
  <a href="index.html" class="btn btn-outline-primary">← Volver</a>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="notificaciones.js" defer></script>

</body>
</html>
