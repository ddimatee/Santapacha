<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Pacha Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Encabezado con logo y mensaje de bienvenida -->
    <div class="welcome-container">
        <div class="santa-pacha">
            <!-- Logo de Santa Pacha -->
            <img src="./escudo-menu.png" alt="Santa Pacha Logo" style="width: 200px; height: auto;">
        </div>
        <!-- Mensaje de bienvenida para el administrador -->
        <div class="welcome-message">¡BIENVENIDO, DOCENTE!</div>
    </div>
    <!-- Contenedor principal de la página -->
    <div class="container">
        <!-- Primera fila de tarjetas -->
        <div class="row g-3">
            <!-- Tarjeta de Gestión de Notas -->
            <div class="col-md-3">
                <a href="/Santapacha/pantalla_docente/gestion_notas/notas.html" class="text-decoration-none">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <img src="img/gestion_nota.png" alt="Gestión de Notas" class="card-img-top" style="width: 90px; height: 90px;">    
                        <h5 class="card-title">Gestión de Notas</h5>
                    </div>
                </div>
                </a>
            </div>
            <div class="col-md-3">
                <!-- Tarjeta de Grados Asignados -->
                <a href="/Santapacha/pantalla_docente/grados_asignados/grados.html" class="text-decoration-none">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <img src="img/Grados.png" alt="Grados Asignados" class="card-img-top" style="width: 90px; height: 90px;">
                        <h5 class="card-title">Grados Asignados</h5>
                    </div>
                </div>
                </a>
            </div>
            <div class="col-md-3">
                <!-- Tarjeta de Estudiantes -->
                <a href="/Santapacha/pantalla_docente/estudiantes/estudiantes.html" class="text-decoration-none">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <img src="img/estudiantes.png" alt="Estudiantes" class="card-img-top" style="width: 90px; height: 90px;">
                        <h5 class="card-title">Estudiantes</h5>
                    </div>
                </div>
                </a>
            </div>
            <div class="col-md-3">
                <!-- Tarjeta de Asignaturas Asignadas -->
                <a href="/Santapacha/pantalla_docente/menu/asignaturas_asignadas/asignaturas.html" class="text-decoration-none">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <img src="img/asignaturas.png" alt="Asignaturas asignadas" class="card-img-top" style="width: 90px; height: 90px;"> 
                        <h5 class="card-title">Asignaturas Asignadas</h5>
                    </div>
                </div>
                </a>
            </div>
        </div>

        <!-- Segunda fila de tarjetas -->
        <div class="row g-3 mt-4 justify-content-center">
            <!-- Tarjeta de Cerrar Sesión -->
            <div class="col-md-3">
                <a href="../../Inicio de Sesion/index.html" class="text-decoration-none">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <img src="img/cerrar-sesion.png" alt="Cerrar Sesión" class="card-img-top" style="width: 90px; height: 90px;">
                        <h5 class="card-title">Cerrar Sesión</h5>
                    </div>
                </div>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
