<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santa-pacha</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
    <div class="santa-pacha">
      <img src="img/escudo-menu.png" alt="Santa Pacha Logo" style="width: 200px; height: auto;">
    </div>
    <div class="welcome-message text-end fw-bold fs-3" style="color: #0277bd;">
        ¡BIENVENIDO, ESTUDIANTE!
      </div>
      
  </div>

  <!-- Tarjetas principales -->
  <div class="container">
    <div class="row g-4 justify-content-center mt-4">
      
      <!-- Reportes académicos -->
      <div class="col-md-3">
        <a href="reportes 2/reporte.html" class="text-decoration-none">
          <div class="card shadow-sm h-100">
            <div class="card-body text-center">
              <img src="https://img.icons8.com/ios/100/000000/document.png" alt="Ver Reportes Académicos" class="mb-2" style="width: 90px; height: 90px;">
              <h5 class="card-title">Ver reportes</h5>
            </div>
          </div>
        </a>
      </div>

      <!-- Notas -->
      <div class="col-md-3">
        <a href="notas 2/nota.html" class="text-decoration-none">
          <div class="card shadow-sm h-100">
            <div class="card-body text-center">
              <img src="https://img.icons8.com/color/96/000000/error--v1.png" alt="Ver Notas" class="mb-2" style="width: 90px; height: 90px;">
              <h5 class="card-title">Ver notas</h5>
            </div>
          </div>
        </a>
      </div>

      <!-- Notificaciones -->
      <div class="col-md-3">
        <a href="notificacion 2/notificacion.html" class="text-decoration-none">
          <div class="card shadow-sm h-100">
            <div class="card-body text-center">
              <img src="https://img.icons8.com/ios-filled/100/000000/bell.png" alt="Notificaciones" class="mb-2" style="width: 90px; height: 90px;">
              <h5 class="card-title">Notificaciones</h5>
            </div>
          </div>
        </a>
      </div>

      <!-- Boletines -->
      <div class="col-md-3">
        <a href="boletin 2/boletin.html" class="text-decoration-none">
          <div class="card shadow-sm h-100">
            <div class="card-body text-center">
              <img src="https://img.icons8.com/ios-filled/100/000000/school.png" alt="Ver Boletines" class="mb-2" style="width: 90px; height: 90px;">
              <h5 class="card-title">Ver boletines</h5>
            </div>
          </div>
        </a>
      </div>

    </div>

    <!-- Fila separada con Asignaturas y Cerrar sesión -->
    <div class="row justify-content-center mt-5 mb-4">

      <!-- Asignaturas -->
      <div class="col-md-3">
        <a href="asignaturas asignadas/asignatura.html" class="text-decoration-none">
          <div class="card shadow-sm h-100">
            <div class="card-body text-center">
              <img src="https://img.icons8.com/ios/100/classroom.png" alt="Asignaturas Asignadas" class="mb-2" style="width: 90px; height: 90px;">
              <h5 class="card-title">Asignaturas</h5>
            </div>
          </div>
        </a>
      </div>

      <!-- Cerrar sesión -->
      <div class="col-md-3">
        <a href="login.html" class="text-decoration-none">
          <div class="card shadow-sm h-100">
            <div class="card-body text-center">
              <img src="https://img.icons8.com/ios-filled/100/000000/logout-rounded.png" alt="Cerrar sesión" class="mb-2" style="width: 90px; height: 90px;">
              <h5 class="card-title">Cerrar sesión</h5>
            </div>
          </div>
        </a>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
